name: VSIX release

on:
  pull_request:
    branches: [main, staging]
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      npm_config_script_shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate native build host
        env:
          VSIX_TARGET: ${{ matrix.target }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.VSIX_TARGET) throw new Error("Runner does not match VSIX target");'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("packages/vscode/package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `vscode-v${version}`) {
              throw new Error("Release tag must equal vscode-v<extension version> (stable semver).");
            }
          '
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a commit included in main."
            exit 1
          }
      - run: npm ci
      - name: Build and package VSIX
        run: npm run package:vsix
      - name: Verify packaged runtime
        run: npm run verify:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix-${{ matrix.target }}
          path: dist/vsix/*.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vscode-vsix-*
          merge-multiple: true
          path: vsix
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" vsix/*.vsix \
            --verify-tag --title "Risu Workbench VS Code ${RELEASE_TAG#vscode-v}" \
            --generate-notes --latest=false
