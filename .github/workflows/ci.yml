name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  verify-cbs-lsp-release-surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Lua analyzer WASM
        run: npm run wasm:build

      - name: Verify cbs-lsp release surface
        run: npm run verify:cbs-lsp-release

      - name: Verify MCP release surface
        run: npm run --workspace @risuai-workbench/mcp test

      - name: Smoke local release tarballs
        run: npm run release:smoke:local
